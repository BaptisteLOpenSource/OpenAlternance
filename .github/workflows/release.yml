name: release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      new: ${{ steps.v.outputs.new }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      # release only when package.json version was bumped
      - id: v
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then echo "new=false"; else echo "new=true"; fi >> "$GITHUB_OUTPUT"
  windows:
    needs: version
    if: needs.version.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Test
        run: bun test src
      - name: Build exe
        run: bun run build:desktop
      - name: Inno Setup
        env:
          MSYS_NO_PATHCONV: "1"
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then choco install innosetup -y --no-progress; fi
          "$ISCC" "/DAppVersion=$(node -p "require('./package.json').version")" installer/openalternance.iss
      - name: Upload setup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: OpenAlternance-Setup
          path: installer/Output/OpenAlternance-Setup.exe
          if-no-files-found: error
  publish:
    if: github.event_name == 'push'
    needs: [version, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download setup
        run: gh run download "$GITHUB_RUN_ID" -n OpenAlternance-Setup -D dist
      - name: Publish release
        env:
          TAG: ${{ needs.version.outputs.tag }}
        # beta in title, not tag: updater only parses plain vX.Y.Z
        run: |
          title="$TAG"; case "$TAG" in v0.*) title="$TAG beta";; esac
          gh release create "$TAG" dist/OpenAlternance-Setup.exe --target "$GITHUB_SHA" --title "$title" --generate-notes
